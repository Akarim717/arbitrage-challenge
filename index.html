function valueNow(day){return s.lots.reduce((a,l)=>a+l.q*(timeline[day][0]-l.buya)+l.short*(l.sellb-timeline[day][1]),0)}function liveLoss(day){return s.realised+valueNow(day)-s.fees-s.borrow}function liveExposure(day){return s.lots.reduce((a,l)=>a+Math.abs(l.q)*timeline[day][0]+Math.abs(l.short)*timeline[day][1],0)}function addLot(q,short,day){s.lots.push({q,short,buya:timeline[day][0],sellb:timeline[day][1],start:day,borrowUntil:day})}function totals(){return s.lots.reduce((a,l)=>({q:a.q+l.q,short:a.short+l.short}),{q:0,short:0})}function charge(day){for(let l of s.lots){let from=l.borrowUntil,to=Math.max(from,day);let base=(l.short>0?l.short*l.sellb: l.q<0?-l.q*l.buya:0)*.08*(to-from)/252;let extra=s.backup&&to>7? Math.max(0,l.short)*l.sellb*.5*.16*(to-Math.max(7,from))/252:0;s.borrow+=base+extra;l.borrowUntil=to}}
function closeFraction(f,day,which='both'){let closeNotional=0;for(let l of s.lots){let q=(which==='short'?0:l.q*f),b=(which==='long'?0:l.short*f);closeNotional+=Math.abs(q)*l.buya+Math.abs(b)*l.sellb;s.realised+=q*(timeline[day][0]-l.buya)+b*(l.sellb-timeline[day][1]);l.q-=q;l.short-=b}let closed=s.lots.reduce((a,l)=>a,0);s.fees+=closeNotional*0.0015}function openTrade(size){let q={PROBE:10000,CONTROLLED:20000,AGGRESSIVE:40000,NONE:0}[size]||0;let b=s.direction==='LONG_ONLY'?0:q*1.5;if(s.direction==='REVERSE'){addLot(-q,-q*1.5,0);s.fees+=(q*75+q*1.5*60)*.0015;s.direction='REVERSE_DIRECTIONAL';return}addLot(q,b,0);s.fees+=(Math.abs(q)*75+Math.abs(b)*60)*.0015}
function metrics(){let day=s.scene<3?0:s.scene===3?3:s.scene<6?7:15;let val=liveLoss(day),exp=liveExposure(day),draw=Math.max(0,-val),equity=5000000+val;let m=document.getElementById('metrics');m.innerHTML=`<div class="metric"><div class="micro">FUND EQUITY (INDICATIVE)</div><strong>${money(equity)}</strong><div class="tiny">Initial mandate · RM5,000,000</div></div><div class="metric"><div class="micro">STRATEGY P/L</div><strong class="${val<0?'negative':'positive'}">${signed(val)}</strong><div class="tiny">Realised + unrealised − fees − borrow</div></div><div class="metric"><div class="micro">RISK BUDGET USED</div><strong>${money(draw)} <span style="font-size:12px;color:#899ba4;font-weight:500">/ RM500k</span></strong><div class="meter"><div style="width:${Math.min(100,100*draw/500000)}%;background:${draw>=500000?'#c75253':'#269b91'}"></div></div><div class="tiny">Hard stop · 10% of fund equity</div></div><div class="metric"><div class="micro">CURRENT GROSS EXPOSURE</div><strong>${money(exp)}</strong><div class="tiny">${totals().q.toLocaleString()} MCA signed · ${totals().short.toLocaleString()} MCB short signed</div></div><div class="metric"><div class="micro">COSTS TO DATE</div><strong>${money(s.fees+s.borrow)}</strong><div class="tiny">Fees ${money(s.fees)} · borrow ${money(s.borrow)}</div></div><div class="metric"><div class="micro">RISK / COMPLIANCE</div><strong style="font-size:15px;color:${s.riskBreach||s.compliance?'#a74f45':'#18806e'}">${s.compliance?'Incident logged':s.riskBreach?'Forced unwind':'Within mandate'}</strong><div class="tiny">Prices follow a fixed, independent timeline</div></div>`;document.getElementById('topMode').textContent=s.mode.toUpperCase()+' MODE'}

function extraInputs(n){if(n===0)return `<div class="grid2">${[['bench','Implied MCA benchmark (RM)'],['gap','Price discount (RM)'],['pct','Discount as % of benchmark']].map(([k,l])=>`<div><label class="field">${l}</label><input class="calcfield" type="number" step="any" id="calc_${k}" placeholder="Your calculation" value="${s.calculations[k]??''}"></div>`).join('')}</div>`;if(n===2)return `<div class="calc"><div class="boxlabel">◫ Position and stress calculator</div><div id="sizecalc">Choose a position size to compare collateral, projected borrowing and a hypothetical spread shock.</div></div>`;if(n===3)return `<div class="calc">Current gross mark-to-market ${signed(s.realised+valueNow(3))} before fees and borrow. The remaining loss budget is approximately ${money(Math.max(0,500000+Math.min(0,s.realised+valueNow(3))))}. A position already in breach will be closed by risk control.</div>`;if(n===4)return `<div class="calc">What-if benchmark at MCB RM64 · ratio 1.50 → RM96.00 · ratio 1.35 → RM86.40. Neither number is a guaranteed tradable price.</div>`;if(n===5)return `<div class="calc">Borrow recall affects half the short leg. Covering only those shares changes the hedge ratio and leaves outright long exposure.</div>`;if(n===6)return `<div class="calc">Remember that open unrealised P/L is not a cash profit. Closing and borrowing costs belong in the reconciliation.</div>`;return ''}

function choose(k){document.querySelectorAll('.choice').forEach(e=>e.classList.toggle('selected',e.dataset.choice===k));let inp=document.querySelector(`input[value="${k}"]`);if(inp)inp.checked=true;if(s.scene===2){let q={PROBE:10000,CONTROLLED:20000,AGGRESSIVE:40000,NONE:0}[k];document.getElementById('sizecalc').innerHTML=`Long ${money(q*75)} · Short ${money(q*1.5*60)} · Gross ${money(q*165)} · 35% collateral ${money(q*165*.35)}<br>15-day base borrowing estimate ${money(q*1.5*60*.08*15/252)} · Hypothetical spread widening by RM16.50 → ${signed(-q*16.5)} gross.`}}
function commonForm(n){let saved=s.choices[n]||'';let opts=optionsFor(n);let special=n===6&&!has();return `<div class="separator"></div><div class="boxlabel">◇ Your decision <span style="margin-left:auto;font-size:11px;color:#82969c">Decision ${n+1}/7</span></div>${special?'<p>No position remains. You will proceed as an observer and document lessons from the case.</p>':opts.map(([v,title,sub])=>`<label class="choice ${saved===v?'selected':''}" data-choice="${v}"><input type="radio" name="choice" value="${v}" ${saved===v?'checked':''} onchange="choose('${v}')"><span><strong>${title}</strong><small>${sub}</small></span></label>`).join('')}${n===2&&s.choices[0]&&['LONG_ONLY','REVERSE'].includes(s.choices[0])?`<div class="notice">Your original hypothesis was directional. <label style="display:block;margin-top:8px"><input type="checkbox" id="switchpair" checked> Switch to the matched pair before execution (uncheck to keep your directional thesis)</label></div>`:''}<label class="field" for="reason">${n===6?'Investment committee memo':'Explain your reasoning'} <span style="font-weight:400">(required)</span></label><textarea id="reason" placeholder="What evidence supports your decision? What might be wrong with your assumptions?">${esc(s.reasons[n]||'')}</textarea><div class="confrow"><label class="field" for="conf">Confidence in your decision</label><b id="confval">${s.confidence[n]??70}%</b></div><input type="range" id="conf" min="0" max="100" step="5" value="${s.confidence[n]??70}" oninput="document.getElementById('confval').textContent=this.value+'%'">${s.mode==='Practice'?`<div class="notice">Practice reflection · Describe the evidence that would lead you to revise your decision. Confidence should reflect uncertainty, not enthusiasm.</div>`:''}<div id="msg" aria-live="polite"></div><div class="btnrow"><span class="tiny">Decision and reasoning will be saved</span><button class="btn" onclick="submitScene()">${n===6?'Submit committee memo →':'Commit decision →'}</button>< function render(){save();drawSteps();let n=s.scene;document.getElementById('illustration').innerHTML=sceneSVG(n===-1?0:n===7?6:n)+`<span class="scene-label">${n===-1?'Academic briefing':n===7?'Learning journey':'Scene '+(n+1)+' · '+names[n]}</span>`;if(n===-1){intro()}else if(n===7){results()}else{let content=[
['A research alert','Monday, 08:45. Two apparently equivalent claims trade at different prices. Your CIO wants a defensible investment idea, not just a compelling chart.','Mei Tan, Chief Investment Officer','“Priya thinks the market has priced these securities inconsistently. Do we have an opportunity, or simply an attractive spreadsheet?”'],

function intro(){document.getElementById('main').innerHTML=`<div class="eyebrow">INVESTMENTS · BEHAVIOURAL FINANCE & TECHNICAL ANALYSIS</div><h1>The Arbitrage Challenge <span style="display:block;color:#44808a;font-size:.55em;margin-top:8px;letter-spacing:-.02em">The Spread That Wouldn’t Close</span></h1><p class="lead">You are a junior portfolio manager at Meridian Capital Partners, Kuala Lumpur. A tempting pricing discrepancy appears between two related securities. Can you extract value without losing control of your risks?</p><div class="introfeatures"><div><div class="micro">FUND MANDATE</div><b>RM5 million</b><small>Simulated capital</small></div><div><div class="micro">DURATION</div><b>35–45 min</b><small>7 consequential decisions</small></div><div><div class="micro">OUTCOMES</div><b>8 distinct endings</b><small>One reflective report</small></div></div><h3>What you will learn</h3><p>Analyse the law of one price; calculate costs, exposure and P/L; evaluate fundamental, implementation and model risk; defend an exit strategy; and reflect on bias and confidence.</p><div class="separator"></div><h3>Choose your learning mode</h3><div class="modecards">${[['Practice','Hints and reflective scaffolding'],['Challenge','Independent reasoning · recommended'],['Assessment','Full instructional feedback after completion'],['Expert','High-stakes judgement and stricter reasoning'],['Explorer','Replay and compare alternate routes']].map(([m,t])=>`<label class="modecard ${s.mode===m?'selected':''}"><input type="radio" name="mode" value="${m}" ${s.mode===m?'checked':''} onchange="s.mode='${m}';render()"> <b>${m}</b><small>${t}</small></label>`).join('')}</div><label class="field" for="learner">Learner name (optional)</label><input type="text" id="learner" placeholder="Your name for the learning report" value="${esc(s.name)}" style="width:100%"><label style="display:flex;align-items:center;gap:10px;margin-top:17px"><input type="checkbox" id="voicecheck" ${s.voice?'checked':''}> Enable optional scene voice-over (browser speech)</label><div class="notice">All market prices are fixed independently of your decisions. A profitable ending does not automatically mean a good decision. The simulation does not trade real securities or provide investment advice.</div><div class="btnrow"><span class="tiny">Your progress will save locally</span><button class="btn" onclick="start()">Enter trading desk →</button></div>`}
function start(){s.name=document.getElementById('learner').value.trim();s.voice=document.getElementById('voicecheck').checked;s.scene=0;render()}
function submitScene(){let n=s.scene;let selected=document.querySelector('input[name=choice]:checked')?.value||(n===6&&!has()?'REFLECT':null);let reason=document.getElementById('reason').value.trim(),conf=Number(document.getElementById('conf').value);let msg=document.getElementById('msg');if(!selected){msg.innerHTML='<div class="notice error">Choose a decision before proceeding.</div>';return}if(reason.length<18){msg.innerHTML='<div class="notice error">Please explain your reasoning in at least 18 characters.</div>';return}if(n===0){let calc={};for(let k of ['bench','gap','pct'])calc[k]=Number(document.getElementById('calc_'+k).value);if(['bench','gap','pct'].some(k=>!document.getElementById('calc_'+k).value)){msg.innerHTML='<div class="notice error">Enter all three calculations before proceeding.</div>';return}s.calculations=calc}
if(n===3&&selected==='ADD'&&has()){let target=totals().q*1.5;let potential=(target*16.5);if(potential>500000||liveExposure(3)*1.5*.35+Math.max(0,-liveLoss(3))>5000000){msg.innerHTML='<div class="notice error">Risk officer rejects the additional position. The existing adverse mark plus proposed exposure violates compliance pre-trade checks. Choose HOLD, REDUCE or EXIT.</div>';return}}
if(n===5&&selected==='USE_BACKUP'&&!s.backup){msg.innerHTML='<div class="notice error">Backup borrow was not arranged in time. Choose an available response.</div>';return}
s.choices[n]=selected;s.reasons[n]=reason;s.confidence[n]=conf;apply(n,selected);s.scene++;render();window.scrollTo({top:0,behavior:'smooth'})}
function apply(n,k){if(n===0){s.direction=k==='LONG_ONLY'?'LONG_ONLY':k==='REVERSE'?'REVERSE':'PAIR';addEvent('Initial hypothesis: '+k)}
if(n===1){s.modelChecked=k==='VERIFY';addEvent(k==='VERIFY'?'Validated economic agreement':'Entitlement remains subject to model assumptions')}
if(n===2){s.size=k;if(['LONG_ONLY','REVERSE'].includes(s.direction)&&document.getElementById('switchpair')?.checked){s.direction='PAIR';addEvent('Revised directional thesis to a matched pair')}openTrade(k);addEvent('Initial position: '+k)}
if(n===3){charge(3);if(has()&&(s.realised+valueNow(3)-s.fees-s.borrow)<-500000){s.riskBreach=true;closeFraction(1,3);addEvent('Mandatory Day 3 risk-limit unwind; later recovery not credited')}else if(k==='REDUCE_HALF'&&has()){closeFraction(.5,3);addEvent('Halved positions at Day 3 prices')}else if(k==='EXIT'&&has()){closeFraction(1,3);addEvent('Voluntary full exit at Day 3 prices')}else if(k==='ADD'&&has()){let t=totals();addLot(t.q*.5,t.short*.5,3);s.fees+=(t.q*.5*67.5+t.short*.5*66)*.0015;addEvent('Added 50% to matched positions at Day 3 quotes')}}

if(n===5){if(has())charge(7);if(k==='USE_BACKUP'){s.backup=true;addEvent('Replacement borrowing used for recalled half at 24% annualised')}else if(k==='ORDERLY_UNWIND'&&has()){closeFraction(1,7);addEvent('Both legs closed at Day 7')}else if(k==='COVER_ONLY'&&has()){closeFraction(.5,7,'short');s.covered=true;addEvent('Half of short leg covered; long exposure left partially unhedged')}else if(k==='IGNORE_RECALL'&&has()){closeFraction(.5,7,'short');s.compliance=true;s.covered=true;addEvent('Forced half-short buy-in and compliance breach')} }
if(n===6){if(has()){charge(15);if(k==='CLOSE')closeFraction(1,15);if(k==='PARTIAL_EXIT')closeFraction(.5,15)}s.ending=resolve();addEvent('Investment committee disposition: '+k)} }
function resolve(){let d=s.choices;if(s.compliance)return'E8';if(s.riskBreach)return'E3';if((s.direction!=='PAIR'&&has())||(d[4]==='IGNORE_WARNING'&&d[6]==='HOLD'&&!s.modelChecked))return'E5';if(s.covered&&has())return'E4';if(d[3]==='EXIT'||d[4]==='REVISE_EXIT'||d[5]==='ORDERLY_UNWIND')return'E6';if(s.size==='NONE')return'E7';if(d[6]==='HOLD'||d[6]==='PARTIAL_EXIT'||d[3]==='REDUCE_HALF'||s.covered)return'E2';if(s.direction==='PAIR'&&d[4]==='VERIFY_BACKUP'&&d[5]==='USE_BACKUP'&&d[6]==='CLOSE')return'E1';return has()?'E5':'E6'}
const endings={E1:['Disciplined relative-value win','You captured convergence through a maintained, cost-aware hedge. The gain was exposed to serious interim drawdown and expensive short borrowing.'],E2:['Profitable, but expensive','Your path retained risk, reduced exposure or continued trading beyond near-convergence. A favourable mark is not the same as a fully realised, inexpensive gain.'],E3:['Risk-limit forced unwind','The trade may have been directionally correct in the long run, but it exceeded the mandatory loss ceiling before convergence. Risk control ended your participation.'],E4:['Borrow recall and broken hedge','Short coverage disrupted the paired relationship. Your remaining position is now partly directional and no longer represents the original relative-value thesis.'],E5:['The model was the problem','The economics, hedge assumptions or evidence discipline did not remain aligned with the strategy. A positive realised mark, if present, cannot repair weak reasoning.'],E6:['Capital preserved through early exit','You closed early, forfeiting possible later convergence in return for reduced uncertainty and funding exposure. Examine whether the decision followed documented limits or loss aversion.'],E7:['Prudent non-participation','You protected capital and avoided execution risks, but did not participate in the narrowing spread. Abstaining may reflect rigour or overcaution.'],E8:['Governance breakdown','A binding lender notice went unaddressed. The resulting forced buy-in produced a compliance failure and residual directional exposure.']};
function score(){let a=[0,0,0,0,0];let calc=s.calculations;a[0]+=(Math.abs(calc.bench-90)<.02?10:0)+(Math.abs(calc.gap-15)<.02?5:0)+(Math.abs(calc.pct-16.6667)<.25?5:0);a[0]+=s.modelChecked?0:0;a[1]+=s.choices[2]==='NONE'?8:16;a[1]+=s.riskBreach?0:4;a[2]+=s.riskBreach?0:14;a[2]+=s.compliance?0:11;a[3]+=s.modelChecked?10:0;a[3]+=s.backup?10:s.size==='NONE'?8:0;a[4]+=Math.min(8,Object.values(s.reasons).filter(t=>t.length>=40).length*2);a[4]+=Object.keys(s.confidence).length>=6?7:0;return a}
function results(){let net=liveLoss(15),mark=valueNow(15);let end=endings[s.ending||resolve()];let summary=score();document.getElementById('main').innerHTML=`<div class="eyebrow">CASE COMPLETE · ACADEMIC DEBRIEF</div><h1 style="font-size:34px">${end[0]}</h1><p class="lead">${end[1]}</p><div class="evidence"><div class="stat"><div class="l">Net marked P/L</div><div class="v ${net<0?'negative':'positive'}" style="font-size:19px">${signed(net)}</div></div><div class="stat"><div class="l">Realised trading P/L</div><div class="v" style="font-size:19px">${signed(s.realised)}</div></div><div class="stat"><div class="l">Unrealised P/L</div><div class="v" style="font-size:19px">${signed(mark)}</div></div></div><div class="calc">Reconciliation · realised ${signed(s.realised)} + unrealised ${signed(mark)} − transaction charges ${money(s.fees)} − stock borrowing ${money(s.borrow)} = <strong>${signed(net)}</strong> net marked P/L. This simplified model excludes taxes, unquoted financing and slippage.</div><h2>Academic debrief</h2><p><b>Why the decisions mattered.</b> The initial relative benchmark was RM90 for MCA against its RM75 market price. A long MCA / short 1.5 MCB position was exposed to divergence, funding and entitlement risk. A persistent deviation does not constitute risk-free arbitrage. On Day 3 the spread widened to −RM31.50, before subsequently narrowing to −RM1.50 on Day 15.</p><p><b>Expert approach.</b> Confirm the actual legal distribution relationship, distinguish economic parity from perfect fungibility, test adverse price moves, reserve sufficient collateral, secure short borrowing, define a falsifiable thesis and respect mandatory limits. A disciplined exit can be defensible even if later prices recover.</p><p><b>Common misconceptions.</b> Short proceeds are not free spending money; margin collateral is not the same as a maximum loss; and an eventual pricing correction does not guarantee the investor can remain solvent until convergence.</p><h2>Learning Journey Report</h2><div class="reportrow"><span>Learner / mode</span><b>${esc(s.name||'Anonymous learner')} · ${s.mode}</b></div><div class="reportrow"><span>Ending</span><b>${s.ending}</b></div><div class="reportrow"><span>Trade direction / initial size</span><b>${esc(s.direction)} / ${esc(s.size)}</b></div><div class="reportrow"><span>Costs</span><b>${money(s.fees+s.borrow)}</b></div><div class="reportrow"><span>Mandate incident</span><b>${s.riskBreach||s.compliance?'Yes':'No'}</b></div><div class="reportrow"><span>Open long / short shares</span><b>${totals().q.toLocaleString()} / ${totals().short.toLocaleString()}</b></div><div class="micro" style="margin-top:23px">LEARNING EVIDENCE · FORMATIVE INDICATORS</div><div class="score">${['Analysis','Calculations','Risk discipline','Updating evidence','Reflection'].map((x,i)=>`<div><b>${summary[i]}/20</b>${x}</div>`).join('')}</div><p class="tiny">Indicative evidence indicators, not a validated examination score. Quality of written reasoning requires instructor evaluation. Outcome achieved and learning demonstrated are distinct.</p><h3>Decision trail and reasoning captured</h3><div class="log">${Object.keys(s.choices).map(k=>`<div class="logitem"><b>Scene ${+k+1} · ${names[k]} · ${esc(s.choices[k])} <span style="color:#8195a1">(${s.confidence[k]}% confidence)</span></b><p>${esc(s.reasons[k])}</p></div>`).join('')}</div><h3>The Road Not Taken</h3><div class="document">${s.size==='AGGRESSIVE'?'A controlled-size position would have produced a smaller interim drawdown and might have survived the Day 3 shock.':s.size==='NONE'?'A controlled-size pair could have profited after convergence but would have suffered a substantial Day 3 mark-to-market drawdown.':s.covered?'Contracting backup borrowing earlier could have preserved the matched hedge, but with higher costs.':'Consider what would change if the short lender forced coverage, the entitlement ratio changed, or your fund held twice the position.'}<p>The Day 15 market outcome is fixed across routes. Alternative positions and financing choices change realised economics and risks, not future market prices.</p></div><h3>Reflect and defend</h3><p>Which belief did you revise after new evidence? Did your confidence track the quality of that evidence? What would justify abandoning the trade before convergence? How would an expert distinguish an attractive spread from an executable strategy?</p><div class="btnrow"><button class="btn light" onclick="exportReport()">⇩ Download learning report</button><button class="btn" onclick="restart()">↻ Explore another pathway</button></div>`;}
function exportReport(){let rows=['THE ARBITRAGE CHALLENGE — LEARNING JOURNEY REPORT','Learner: '+(s.name||'Anonymous'),'Mode: '+s.mode,'Ending: '+(s.ending||'Not completed'),'Initial size: '+s.size,'Direction: '+s.direction,'Gross realised P/L: '+signed(s.realised),'Gross unrealised P/L: '+signed(valueNow(s.scene===7?15:s.scene>=3?3:0)),'Fees: '+money(s.fees),'Borrow costs: '+money(s.borrow),'Risk breach: '+s.riskBreach,'Compliance incident: '+s.compliance,'','DECISIONS AND REASONING',...Object.keys(s.choices).flatMap(k=>['Scene '+(+k+1)+' — '+names[k]+': '+s.choices[k],'Confidence: '+s.confidence[k]+'%','Reason: '+s.reasons[k],'']),'LEARNING REFLECTION','Distinguish a good outcome from a good decision process. Revisit the law of one price, financing and forced-short risk.'];let blob=new Blob([rows.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Arbitrage_Challenge_Learning_Journey.txt';a.click();URL.revokeObjectURL(a.href)}function restart(){if(confirm('Start a new attempt? Your current progress will be reset. Export your report first if you need a copy.')){if('speechSynthesis' in window)window.speechSynthesis.cancel();s=fresh();render();window.scrollTo(0,0)}}function toggleVoice(){s.voice=!s.voice;if(!s.voice&&'speechSynthesis'in window)speechSynthesis.cancel();render()}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.95;u.pitch=1;speechSynthesis.speak(u)}function showConcepts(){alert('Key concepts: law of one price; limits to arbitrage; model risk; fundamental risk; short-sale constraints; margin; borrow recall; loss budget; confirmation bias; outcome bias. The simulation tests applied reasoning rather than merely identifying terms.')}render();
</script></body></html>
